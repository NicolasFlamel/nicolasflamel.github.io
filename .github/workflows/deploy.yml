name: gh-pages deploy

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - public/**
      - .github/workflows/deploy.yml

permissions:
  contents: write

jobs:
  build:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies + Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_FORM_KEY: ${{ secrets.VITE_FORM_KEY }}

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
